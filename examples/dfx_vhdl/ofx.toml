[project]
name = "dfx_vhdl"
top = "dfx_vhdl"
board = "arty-a7-35t"
sources = ["src/dfx_vhdl.v"]
constraints = ["constraints/dfx_vhdl.xdc"]
seed = 1

[clocks]
clk = 10.0

[dfx]
partpins = "anchors"
rar = false
compress = false
decoupler = false

[[dfx.partition]]
name = "rp0"
inst = "u_rm"
region = "SLICE_X12Y100:SLICE_X15Y149"
ports = "rm/ports.json"
register = ["ready"]
rms = { xor = "rm/rm_core_xor.vhd", andn = "rm/rm_core_andn.vhd" }
