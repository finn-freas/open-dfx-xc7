[board]
name = "Digilent Zybo Z7-20"
part = "xc7z020clg400-1"
openfpgaloader_board = "zybo_z7_20"
iostandard = "LVCMOS33"
pins_verified = true
pin_source = "Digilent Zybo-Z7-Master.xdc ('for the Zybo Z7 Rev. B', 'compatible with the Zybo Z7-20 and Zybo Z7-10', github.com/Digilent/digilent-xdc master c8644a9f, sha256 63a84335...d478, read 2026-11-06); part from Digilent vivado-boards new/board_files/zybo-z7-20/A.0/board.xml (sha256 650c4ca1...42cc)"
notes = "PL pins below. The PS is configured by ofx boot from the [zynq] section (U-Boot SPL with the board ps7_init); see docs/ofx.md, Zynq. Digilent's file has no PL pins for the USB-UART, so there is no [uart]."

[clock]
port = "clk"
pin = "K17"
period_ns = 8.0
iostandard = "LVCMOS33"

[leds]
"led[0]" = "M14"
"led[1]" = "M15"
"led[2]" = "G14"
"led[3]" = "D18"

[dfx]
example_region = "SLICE_X40Y50:SLICE_X43Y99"

[zynq]
uboot_dt = "zynq-zybo-z7"
ps_init = "board/xilinx/zynq/zynq-zybo-z7/ps7_init_gpl.c"
ps_init_source = "U-Boot v2025.10 board/xilinx/zynq/zynq-zybo-z7/ps7_init_gpl.c (GPL-2.0+; generated by Vivado 2018.2 from the Digilent Zybo-Z7-20 board preset, per its header)"
fclk0_mhz = 50.0
uart = "UART1 on MIO 48/49 (USB-UART), 115200 8N1"
