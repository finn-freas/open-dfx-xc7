[project]
name = "dfx_a50"
top = "dfx_a50"
board = "nexys-a7-50t"
sources = ["src/dfx_a50.v"]
constraints = ["constraints/dfx_a50.xdc"]
seed = 1

[clocks]
clk = 10.0

[dfx]
partpins = "anchors"
rar = false
compress = false
decoupler = false

[[dfx.partition]]
name = "rp0"
inst = "u_rm"
region = "SLICE_X12Y100:SLICE_X15Y149"
ports = "rm/ports.json"
register = ["ready"]
rms = { xor = "rm/rm_core_xor.v", andn = "rm/rm_core_andn.v" }
